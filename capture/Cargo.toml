[package]
name = "clipper-capture"
version = "0.1.0"
edition = "2021"
description = "Instant-replay ring buffer recorder for Clipper"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only pulled in by the `dump` feature, which exists to verify the capture path
# against real pixels. It has no part in the recording pipeline.
png = { version = "0.17", optional = true }

# RNNoise, ported to Rust: microphone noise suppression with no C toolchain and no DLL to ship.
# See denoise.rs. The default features are its command-line tools.
nnnoiseless = { version = "0.5.2", default-features = false }

# `windows`' own core crate, named directly because `#[implement]` expands to paths in it.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_SystemInformation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# On during development so `cargo run -- dump` works without extra flags.
# Turn off before shipping: the PNG encoder is diagnostics, not payload.
default = ["dump"]
dump = ["dep:png"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# Stamps the version resource and icon onto the exe; see build.rs. `toml` is a default feature
# that only exists to read package metadata out of this file, which build.rs sets by hand.
winresource = { version = "0.1.31", default-features = false }
